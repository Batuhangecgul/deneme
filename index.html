<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pembe Hesap Makinesi</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="calculator" aria-label="Hesap makinesi">
      <h1>Hesap Makinesi</h1>
      <output id="display" class="display" aria-live="polite">0</output>
      <div class="keys">
        <button class="key key-clear" data-action="clear">C</button>
        <button class="key key-operator" data-operation="divide" aria-label="Bölme">÷</button>
        <button class="key key-operator" data-operation="multiply" aria-label="Çarpma">×</button>
        <button class="key key-operator" data-operation="subtract" aria-label="Çıkarma">−</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key key-operator" data-operation="add" aria-label="Toplama">+</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key key-equals" data-action="equals">=</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key key-zero" data-number="0">0</button>
        <button class="key" data-action="decimal">,</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
